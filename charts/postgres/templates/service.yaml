apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}-postgresql
  labels:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
    app.kubernetes.io/component: database
spec:
  ports:
    - name: tcp-postgresql
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app.kubernetes.io/name: {{ include "postgres.name" . }}
