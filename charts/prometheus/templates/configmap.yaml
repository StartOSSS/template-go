apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['127.0.0.1:{{ .Values.service.port }}']
      - job_name: todo-app
        static_configs:
          - targets:
{{- range .Values.scrapeTargets }}
              - '{{ . }}'
{{- end }}
