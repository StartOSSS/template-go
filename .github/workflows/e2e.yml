name: E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_call:

env:
  GCP_PROJECT: example-project
  GCP_REGION: us-central1
  GAR_REPOSITORY: us-central1-docker.pkg.dev/example-project/template-go

jobs:
  minikube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start minikube
        uses: medyagh/setup-minikube@v0.0.15
        with:
          kubernetes-version: v1.28.0
      - name: Build images inside minikube
        run: |
          eval "$(minikube docker-env)"
          docker build -t todo-app:ci -f Dockerfile .
          docker build -t todo-integration:ci -f integration/Dockerfile .
          docker build -t todo-k6:ci -f loadtest/Dockerfile .
      - name: Deploy stack with Helm
        run: |
          kubectl create namespace todo --dry-run=client -o yaml | kubectl apply -f -
          cat <<'EOF' | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: todo-postgres-postgresql
  namespace: todo
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: todo-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-postgres
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-postgres
  template:
    metadata:
      labels:
        app: todo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: todo
            - name: POSTGRES_PASSWORD
              value: todo
            - name: POSTGRES_DB
              value: todo
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready","-U","todo"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
EOF
          kubectl rollout status deployment/todo-postgres -n todo --timeout=5m
          helm upgrade --install todo-app charts/todo-app \
            --namespace todo --create-namespace \
            --set appImage=todo-app:ci \
            --set integrationImage=todo-integration:ci \
            --set loadImage=todo-k6:ci
          kubectl rollout status deployment/todo-app -n todo --timeout=10m
      - name: Helm integration tests
        run: |
          helm test todo-app -n todo --filter integration --timeout 5m
          helm test todo-app -n todo --filter load --timeout 10m
      - name: API smoke test
        run: kubectl run curl --image=curlimages/curl --rm -i --restart=Never -- curl -sf http://todo-app.todo:8080/healthz
