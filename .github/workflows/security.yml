name: Security
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: osv-scanner
        uses: google/osv-scanner-action@v1
      - name: Syft SBOM
        uses: anchore/sbom-action@v0
      - name: Grype
        uses: anchore/scan-action@v4
        with:
          path: .
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
