name: Test
on:
  pull_request:
  push:
    branches: [main]

env:
  GAR_REPOSITORY: us-central1-docker.pkg.dev/example-project/template-go

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go test
        run: go test ./...
      - name: Install container-structure-test
        run: |
          go install github.com/GoogleContainerTools/container-structure-test/cmd/container-structure-test@v1.22.0
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"
      - name: Container structure tests
        run: |
          container-structure-test test --image ${GAR_REPOSITORY}/todo-app:latest --config structure-test.yaml || true
  e2e:
    needs: unit
    uses: ./.github/workflows/e2e.yml
