datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://todo-mimir-nginx.observability.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://todo-loki.observability.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        url: http://todo-tempo.observability.svc.cluster.local:3100
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        url: http://todo-pyroscope.observability.svc.cluster.local:4040
adminPassword: grafana
service:
  type: ClusterIP
  port: 80
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: ["todo-dashboards"]
persistence:
  enabled: false
