datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://todo-prometheus.observability.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Tempo
        type: tempo
        url: http://todo-tempo.observability.svc.cluster.local:3100
adminPassword: grafana
service:
  type: ClusterIP
  port: 80
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: default
    searchNamespace: ALL
persistence:
  enabled: false
